spring:
  application:
    name: SpringTest

  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123456
    url: jdbc:postgresql://localhost:5432/postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20

  flyway:
    default-schema: spring_test

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 1h
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "springtest:cache:"

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 500

outbox:
  publisher:
    delay-ms: 5000
    batch-size: 50
    default-topic: delivery.created
    stale-timeout-ms: 120000
    max-attempts: 5
    retry-base-delay-ms: 2000
    topic-mapping:
      DeliveryCreated: delivery.created

enrichment-service:
  url: http://localhost:8081

saga:
  enrichment-worker:
    delay-ms: 60000
    batch-size: 50
    max-attempts: 5

resilience4j:
  retry:
    instances:
      enrichmentService:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 5s
        randomized-wait-factor: 0.3
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - org.springframework.web.client.HttpClientErrorException.NotFound

  circuitbreaker:
    instances:
      enrichmentService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException.NotFound

  ratelimiter:
    instances:
      enrichmentService:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 500ms